function renderArticles(cat){
  var list=cat==='all'?articles:articles.filter(function(a){return a.cat===cat;});
  var g=document.getElementById('magazineGrid');
  g.innerHTML=list.map(function(a){return'<div class="mag-card"><div class="mag-card-img" style="background:var(--bg-secondary);">'+a.img+'</div><div class="mag-card-body"><span class="mag-card-date">📅 '+a.date+'</span><h3>'+a.title+'</h3><p>'+a.desc+'</p><div class="mag-card-tags"><span class="mag-tag">'+a.tag+'</span></div></div></div>';}).join('');
}

document.querySelectorAll('.mag-cat').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.mag-cat').forEach(function(x){x.classList.remove('active');});
    this.classList.add('active');
    renderArticles(this.dataset.cat);
  });
});

renderArticles('all');

// Particles
(function(){
  var c=document.getElementById('particles'),ctx=c.getContext('2d'),w,h,pts=[];
  function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}
  rs();addEventListener('resize',rs);
  for(var i=0;i<40;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,r:Math.random()*1.2+0.3,a:Math.random()*0.3+0.05});
  (function dr(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle='rgba(6,182,212,'+p.a+')';ctx.fill();});
    requestAnimationFrame(dr);
  })();
})();
