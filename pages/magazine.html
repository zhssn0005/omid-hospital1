function renderArticles(cat) {
  var list = cat === 'all' ? articles : articles.filter(function (a) { return a.cat === cat; });
  var g = document.getElementById('magazineGrid');
  g.innerHTML = list.map(function (a, i) {
    return '<div class="mag-card" data-index="' + i + '">' +
      '<div class="mag-card-img">' + a.img + '</div>' +
      '<div class="mag-card-body">' +
        '<span class="mag-card-date">📅 ' + a.date + '</span>' +
        '<h3>' + a.title + '</h3>' +
        '<p>' + a.desc + '</p>' +
        '<div class="mag-card-tags"><span class="mag-tag">' + a.tag + '</span></div>' +
        '<span class="mag-read-more">مطالعه کامل مقاله ←</span>' +
      '</div></div>';
  }).join('');

  /* Re-bind click for the filtered list */
  document.querySelectorAll('.mag-card').forEach(function (card) {
    card.addEventListener('click', function () {
      var idx = parseInt(card.dataset.index, 10);
      var art = list[idx];
      openArticle(art);
    });
  });
}

function openArticle(a) {
  document.getElementById('articleTitle').textContent = a.title;
  var html = '<div class="mag-card-tags"><span class="mag-tag">' + a.tag + '</span><span style="color:var(--text-muted);font-size:0.8rem;">📅 ' + a.date + '</span></div>';
  a.body.forEach(function (b) {
    if (b.h) html += '<h3>' + b.h + '</h3>';
    if (b.p) html += '<p>' + b.p + '</p>';
    if (b.ul) {
      html += '<ul>' + b.ul.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ul>';
    }
    if (b.note) html += '<div class="note">💡 ' + b.note + '</div>';
  });
  document.getElementById('articleBody').innerHTML = html;
  document.getElementById('articleOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeArticle() {
  document.getElementById('articleOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('articleClose').addEventListener('click', closeArticle);
document.getElementById('articleOverlay').addEventListener('click', function (e) {
  if (e.target === this) closeArticle();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeArticle();
});

document.querySelectorAll('.mag-cat').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.mag-cat').forEach(function (x) { x.classList.remove('active'); });
    this.classList.add('active');
    renderArticles(this.dataset.cat);
  });
});

renderArticles('all');
</script>
