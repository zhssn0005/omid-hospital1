<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لیست کامل پزشکان | بیمارستان امید</title>
<meta name="description" content="۱۸۶ پزشک فعال در ۳۲ رشته تخصصی - جستجو و رزرو نوبت آنلاین">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
body { padding-top: 5.3rem; }
.page-back { display: inline-block; padding: 1rem 2rem; color: var(--teal); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
.doctors-header {
  text-align: center; padding: 2.5rem 1rem;
  background: linear-gradient(135deg, var(--primary-light), var(--teal-light));
  border-bottom: 1px solid var(--border);
}
.doctors-header h1 { font-size: 2.2rem; font-weight: 900; color: var(--text-primary); }
.doctors-header p { color: var(--text-secondary); margin-top: 0.4rem; }
.header-stats { display: flex; gap: 2.5rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-number { font-size: 1.9rem; font-weight: 900; color: var(--teal); }
.stat-label { font-size: 0.82rem; color: var(--text-muted); }

.filters-section {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow-sm);
}
.search-bar { display: flex; gap: 0.75rem; margin-bottom: 1.2rem; }
.search-input {
  flex: 1; padding: 0.8rem 1.1rem; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: #fff; color: var(--text-primary);
  font-family: 'Vazirmatn', sans-serif; font-size: 0.95rem; transition: var(--transition);
}
.search-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18,148,154,0.1); }
.search-btn {
  padding: 0.8rem 1.8rem; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), var(--teal)); border: none; color: #fff;
  font-weight: 700; cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
}
.search-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
.filter-select {
  padding: 0.7rem 1rem; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: #fff; color: var(--text-primary);
  font-family: 'Vazirmatn', sans-serif; font-size: 0.88rem; cursor: pointer; transition: var(--transition);
}
.filter-select:focus { outline: none; border-color: var(--teal); }

.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
.results-count { font-size: 0.95rem; color: var(--text-muted); }
.results-count strong { color: var(--teal); font-weight: 800; }
.view-toggle { display: flex; gap: 0.5rem; }
.view-btn {
  padding: 0.5rem 1rem; border-radius: 8px; border: 1.5px solid var(--border);
  background: #fff; color: var(--text-muted); font-weight: 700; font-size: 0.82rem;
  cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
}
.view-btn.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal-dark); }

.doctors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.3rem; margin-bottom: 2.5rem; }
.doctor-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.5rem; text-align: center; transition: var(--transition); cursor: pointer;
}
.doctor-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.doctor-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--primary-light); display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem; margin: 0 auto 1rem; border: 3px solid var(--teal-light);
  overflow: hidden;
}
.doctor-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; padding: 0; box-sizing: border-box; image-rendering: auto; cursor: zoom-in; transition: transform .35s ease; } .doctor-avatar:hover img { transform: scale(1.06); } .doctor-card { overflow: hidden; }
.doctor-name { font-weight: 800; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.3rem; }
.doctor-specialty { color: var(--teal); font-size: 0.82rem; margin-bottom: 0.7rem; font-weight: 600; }
.doctor-badges { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
.badge {
  padding: 0.25rem 0.6rem; background: var(--primary-light);
  border-radius: 6px; font-size: 0.72rem; color: var(--text-secondary); font-weight: 600;
}
.badge.bookable { background: var(--success-light); color: var(--success); }
.doctor-actions { display: flex; gap: 0.5rem; }
.btn-sm { flex: 1; padding: 0.55rem 0.6rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition); border: none; font-family: 'Vazirmatn', sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-primary-sm { background: linear-gradient(135deg, var(--primary), var(--teal)); color: #fff; }
.btn-primary-sm:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn-secondary-sm { background: #fff; border: 1.5px solid var(--border); color: var(--teal); }
.btn-secondary-sm:hover { background: var(--teal-light); }

.doctors-list { display: none; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
.doctors-list.active { display: flex; }
.doctor-list-card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.25rem; display: grid; grid-template-columns: 90px 1fr auto; gap: 1.2rem;
  align-items: center; transition: var(--transition); cursor: pointer;
}
.doctor-list-card:hover { border-color: var(--teal); box-shadow: var(--shadow-sm); }
.list-avatar {
  width: 84px; height: 84px; border-radius: 14px; overflow: hidden;
  background: var(--primary-light); display: flex; align-items: center; justify-content: center;
  font-size: 2.4rem; border: 2px solid var(--teal-light);
}
.list-avatar img { width: 100%; height: 100%; object-fit: contain; object-position: center; padding: 7px; box-sizing: border-box; image-rendering: auto; }
.list-info { flex: 1; }
.list-name { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.3rem; }
.list-specialty { color: var(--teal); font-size: 0.88rem; margin-bottom: 0.5rem; font-weight: 600; }
.list-details { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
.list-actions { display: flex; flex-direction: column; gap: 0.5rem; min-width: 160px; }

.pagination { display: flex; gap: 0.5rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
.page-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--border);
  background: #fff; color: var(--text-muted); font-weight: 700; cursor: pointer;
  transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
}
.page-btn:hover { border-color: var(--teal); color: var(--teal); }
.page-btn.active { background: linear-gradient(135deg, var(--primary), var(--teal)); border-color: transparent; color: #fff; }

@media (max-width: 768px) {
  .header-stats { flex-direction: column; gap: 1rem; }
  .results-header { flex-direction: column; align-items: flex-start; }
  .doctor-list-card { grid-template-columns: 1fr; text-align: center; }
  .list-avatar { margin: 0 auto; }
  .list-details { justify-content: center; }
  .list-actions { width: 100%; }
}
</style>
</head>
<body>

<div style="max-width:1400px;margin:0 auto;">
  <a href="/" class="page-back">← بازگشت به صفحه اصلی</a>
</div>

<div class="doctors-header">
  <h1>👨‍⚕️ لیست کامل پزشکان</h1>
  <p>جستجو و رزرو نوبت با پزشکان فعال بیمارستان امید</p>
  <div class="header-stats">
    <div class="stat"><div class="stat-number" id="totalDoctors">۰</div><div class="stat-label">پزشک متخصص</div></div>
    <div class="stat"><div class="stat-number">۳۲</div><div class="stat-label">تخصص پزشکی</div></div>
    <div class="stat"><div class="stat-number" id="bookableDoctors">۰</div><div class="stat-label">با نوبت‌دهی آنلاین</div></div>
  </div>
</div>

<div class="container" style="margin-top:2rem;">
  <div class="filters-section">
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="جستجوی نام پزشک یا تخصص..." id="searchInput">
      <button class="search-btn" onclick="filterDoctors()">🔍 جستجو</button>
    </div>
    <div class="filters-grid">
      <select class="filter-select" id="specialtyFilter" onchange="filterDoctors()">
        <option value="">همه تخصص‌ها</option>
      </select>
      <select class="filter-select" id="bookableFilter" onchange="filterDoctors()">
        <option value="">همه پزشکان</option>
        <option value="bookable">فقط نوبت‌دهی آنلاین</option>
      </select>
      <select class="filter-select" id="genderFilter" onchange="filterDoctors()">
        <option value="">همه</option>
        <option value="آقا">آقا</option>
        <option value="خانم">خانم</option>
      </select>
    </div>
  </div>

  <div class="results-header">
    <div class="results-count"><strong id="resultsCount">۰</strong> پزشک یافت شد</div>
    <div class="view-toggle">
      <button class="view-btn active" id="btnGrid" onclick="toggleView('grid')">🔲 کارت</button>
      <button class="view-btn" id="btnList" onclick="toggleView('list')">☰ لیست</button>
    </div>
  </div>

  <div class="doctors-grid active" id="gridView"></div>
  <div class="doctors-list" id="listView"></div>

  <div class="pagination" id="pagination"></div>
</div>

<script src="/doctors-data.js"></script>
<script>
/* ─── داده پزشکان از doctors-data.js ─── */
var allDoctors = (typeof DOCTORS !== 'undefined') ? DOCTORS.map(function (d) {
  return {
    id: Number.isInteger(d.id) ? d.id : null,
    name: d.n,
    specialty: d.sp,
    gender: d.g || '',
    bookable: !!d.b,
    img: d.img || ''
  };
}) : [];

var filteredDoctors = allDoctors.slice();
var currentPage = 1;
var itemsPerPage = 12;
var currentView = 'grid';

/* ─── ساخت گزینه‌های تخصص ─── */
function buildSpecialtyOptions() {
  var specs = {};
  allDoctors.forEach(function (d) { if (d.specialty) specs[d.specialty] = true; });
  var sel = document.getElementById('specialtyFilter');
  sel.innerHTML = '<option value="">همه تخصص‌ها</option>';
  Object.keys(specs).sort().forEach(function (s) {
    var opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
}

/* ─── آمار ─── */
document.getElementById('totalDoctors').textContent = allDoctors.length.toLocaleString('fa-IR');
document.getElementById('bookableDoctors').textContent = allDoctors.filter(function (d) { return d.bookable; }).length.toLocaleString('fa-IR');

function safeImagePath(value) {
  var image = String(value || '').replace(/^\/+/, '');
  return /^(assets|uploads)\/[\w./-]+$/.test(image) ? '/' + image : '';
}

function doctorNameKey(value) {
  return String(value || '').replace(/\s+/g, ' ').trim();
}

function profileHref(d) {
  return d.id ? '/pages/doctor-profile.html?id=' + encodeURIComponent(d.id) + '&name=' + encodeURIComponent(d.name) : '/pages/doctor-profile.html?name=' + encodeURIComponent(d.name);
}

function bookingHref(d) {
  return d.id ? '/booking.html?doctor_id=' + encodeURIComponent(d.id) + '&doctor_name=' + encodeURIComponent(d.name) : '/booking.html?doctor_name=' + encodeURIComponent(d.name);
}

function avatarHTML(d) {
  var image = safeImagePath(d.img);
  if (image) {
    return '<img src="' + image + '" alt="' + d.name + '" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML=\'👨‍⚕️\'">';
  }
  var g = (d.name.indexOf('خانم') !== -1 || d.name.indexOf('سرکار') !== -1) ? '👩‍⚕️' : '👨‍⚕️';
  return g;
}

async function syncDoctorsWithApi() {
  try {
    var firstResponse = await fetch('/api/doctors?limit=100&page=1');
    if (!firstResponse.ok) return;
    var first = await firstResponse.json();
    var apiDoctors = first.data || [];
    var pages = Number(first.pagination && first.pagination.pages) || 1;
    for (var page = 2; page <= pages; page += 1) {
      var pageResponse = await fetch('/api/doctors?limit=100&page=' + page);
      if (!pageResponse.ok) continue;
      var pageData = await pageResponse.json();
      apiDoctors = apiDoctors.concat(pageData.data || []);
    }
    var byKey = {};
    apiDoctors.forEach(function (doc) {
      var name = doc.full_name || String(doc.bio || '').split(' — ')[0];
      var key = doctorNameKey(name) + '|' + doctorNameKey(doc.specialty_name);
      if (name && doc.specialty_name) byKey[key] = doc;
    });
    allDoctors.forEach(function (doctor) {
      var apiDoctor = byKey[doctorNameKey(doctor.name) + '|' + doctorNameKey(doctor.specialty)];
      if (!apiDoctor) return;
      doctor.id = Number(apiDoctor.id);
      doctor.bookable = !!apiDoctor.is_available;
      if (!doctor.img && apiDoctor.image_url) doctor.img = apiDoctor.image_url;
    });
    filteredDoctors = allDoctors.slice();
    buildSpecialtyOptions();
    renderDoctors();
  } catch (_) {
    // The static archive remains usable when the API is unavailable.
  }
}

function renderDoctors() {
  var start = (currentPage - 1) * itemsPerPage;
  var end = start + itemsPerPage;
  var pageData = filteredDoctors.slice(start, end);

  var gridHTML = pageData.map(function (d) {
    return '<div class="doctor-card">' +
      '<div class="doctor-avatar">' + avatarHTML(d) + '</div>' +
      '<div class="doctor-name">' + d.name + '</div>' +
      '<div class="doctor-specialty">' + d.specialty + '</div>' +
      '<div class="doctor-badges">' +
        (d.bookable ? '<span class="badge bookable">📅 نوبت‌دهی</span>' : '') +
        '<span class="badge">' + d.gender + '</span>' +
      '</div>' +
      '<div class="doctor-actions">' +
        (d.bookable ? '<a href="' + bookingHref(d) + '" class="btn-sm btn-primary-sm">رزرو نوبت</a>' : '') +
        '<a href="' + profileHref(d) + '" class="btn-sm btn-secondary-sm">مشاهده پروفایل</a>' +
      '</div>' +
    '</div>';
  }).join('');

  var listHTML = pageData.map(function (d) {
    return '<div class="doctor-list-card">' +
      '<div class="list-avatar">' + avatarHTML(d) + '</div>' +
      '<div class="list-info">' +
        '<div class="list-name">' + d.name + '</div>' +
        '<div class="list-specialty">' + d.specialty + '</div>' +
        '<div class="list-details">' +
          '<span>' + d.gender + '</span>' +
          (d.bookable ? '<span>📅 نوبت‌دهی آنلاین</span>' : '<span>نوبت‌دهی تلفنی</span>') +
        '</div>' +
      '</div>' +
      '<div class="list-actions">' +
        (d.bookable ? '<a href="' + bookingHref(d) + '" class="btn-sm btn-primary-sm">📅 رزرو نوبت</a>' : '') +
        '<a href="' + profileHref(d) + '" class="btn-sm btn-secondary-sm">مشاهده پروفایل</a>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('gridView').innerHTML = gridHTML;
  document.getElementById('listView').innerHTML = listHTML;
  document.getElementById('resultsCount').textContent = filteredDoctors.length.toLocaleString('fa-IR');
  renderPagination();
}

function renderPagination() {
  var totalPages = Math.ceil(filteredDoctors.length / itemsPerPage);
  var html = '';
  for (var i = 1; i <= totalPages; i++) {
    html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i.toLocaleString('fa-IR') + '</button>';
  }
  document.getElementById('pagination').innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  renderDoctors();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterDoctors() {
  var specialty = document.getElementById('specialtyFilter').value;
  var bookable = document.getElementById('bookableFilter').value;
  var gender = document.getElementById('genderFilter').value;
  var search = document.getElementById('searchInput').value.trim();

  filteredDoctors = allDoctors.filter(function (d) {
    if (specialty && d.specialty !== specialty) return false;
    if (bookable === 'bookable' && !d.bookable) return false;
    if (gender && d.gender !== gender) return false;
    if (search && (d.name + ' ' + d.specialty).indexOf(search) === -1) return false;
    return true;
  });

  currentPage = 1;
  renderDoctors();
}

function toggleView(view) {
  currentView = view;
  document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
  document.getElementById('btnList').classList.toggle('active', view === 'list');
  document.getElementById('gridView').classList.toggle('active', view === 'grid');
  document.getElementById('listView').classList.toggle('active', view === 'list');
  if (view === 'grid') document.getElementById('gridView').style.display = 'grid';
  else document.getElementById('gridView').style.display = 'none';
  if (view === 'list') document.getElementById('listView').style.display = 'flex';
  else document.getElementById('listView').style.display = 'none';
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') filterDoctors();
});

/* ─── راه‌اندازی ─── */
buildSpecialtyOptions();
renderDoctors();
syncDoctorsWithApi();
</script>

<script src="/js/site-shell.js"></script>
</body>
</html>
