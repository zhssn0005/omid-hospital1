<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اخبار و رویدادها | بیمارستان امید</title>
<meta name="description" content="آخرین اخبار بیمارستان، سمینارهای آموزشی، رویدادهای پزشکی و مقالات تخصصی">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
body { padding-top: 5.3rem; }
.page-back { display: inline-block; padding: 1rem 2rem; color: var(--teal); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
.page-header { text-align: center; padding: 2.5rem 1rem; background: linear-gradient(135deg, var(--primary-light), var(--teal-light)); border-bottom: 1px solid var(--border); }
.page-header h1 { font-size: 2.2rem; font-weight: 900; color: var(--text-primary); }
.page-header p { color: var(--text-secondary); margin-top: 0.4rem; }
.container { max-width: 1250px; margin: 2rem auto 4rem; padding: 0 1.5rem; }
.controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filter-btn {
  padding: 0.5rem 1.2rem; border-radius: var(--radius-full); border: 1.5px solid var(--border);
  background: #fff; color: var(--text-secondary); font-weight: 700; font-size: 0.85rem;
  cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
}
.filter-btn:hover { border-color: var(--teal); color: var(--teal); }
.filter-btn.active { background: linear-gradient(135deg, var(--primary), var(--teal)); border-color: transparent; color: #fff; box-shadow: var(--shadow-md); }
.search-box { display: flex; gap: 0.5rem; flex: 1; max-width: 380px; }
.search-input { flex: 1; padding: 0.55rem 1rem; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: #fff; color: var(--text-primary); font-family: 'Vazirmatn', sans-serif; font-size: 0.9rem; }
.search-input:focus { outline: none; border-color: var(--teal); }
.search-btn { padding: 0.55rem 1.4rem; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--primary), var(--teal)); border: none; color: #fff; font-weight: 700; cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif; }
.search-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.content-wrapper { display: grid; grid-template-columns: 1fr 300px; gap: 1.8rem; }
.news-grid { display: grid; gap: 1.4rem; }
.news-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: 250px 1fr; transition: var(--transition); cursor: pointer; }
.news-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.news-image { position: relative; background: linear-gradient(135deg, var(--primary-light), var(--teal-light)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; min-height: 170px; }
.news-badge { position: absolute; top: 0.7rem; right: 0.7rem; padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.72rem; font-weight: 700; }
.badge-news { background: var(--teal); color: #fff; }
.badge-event { background: var(--gold); color: #fff; }
.badge-seminar { background: var(--success); color: #fff; }
.news-content { padding: 1.4rem; display: flex; flex-direction: column; }
.news-meta { display: flex; gap: 0.9rem; margin-bottom: 0.7rem; font-size: 0.78rem; color: var(--text-muted); }
.news-title { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem; line-height: 1.45; }
.news-excerpt { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7; margin-bottom: 1rem; flex: 1; }
.news-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); }
.news-author { font-size: 0.82rem; color: var(--text-muted); }
.read-more { padding: 0.35rem 0.9rem; border-radius: 8px; background: var(--teal-light); border: 1.5px solid var(--teal); color: var(--teal-dark); font-weight: 700; font-size: 0.8rem; transition: var(--transition); font-family: 'Vazirmatn', sans-serif; cursor: pointer; }
.sidebar { display: flex; flex-direction: column; gap: 1.4rem; }
.sidebar-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); }
.sidebar-title { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); margin-bottom: 1rem; }
.calendar { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.calendar-header { background: linear-gradient(135deg, var(--primary), var(--teal)); padding: 0.8rem; text-align: center; color: #fff; font-weight: 800; font-size: 0.95rem; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
.calendar-day:hover { background: var(--teal-light); color: var(--teal); }
.calendar-day.has-event { color: var(--teal); font-weight: 700; position: relative; }
.calendar-day.has-event::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--teal); }
.upcoming-events { display: flex; flex-direction: column; gap: 0.7rem; }
.event-item { padding: 0.75rem; background: var(--bg); border-radius: 10px; border-right: 3px solid var(--gold); transition: var(--transition); cursor: pointer; }
.event-item:hover { transform: translateX(-3px); }
.event-date { font-size: 0.73rem; color: var(--gold); font-weight: 700; margin-bottom: 0.2rem; }
.event-title { font-size: 0.85rem; color: var(--text-primary); font-weight: 700; }
.popular-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tag { padding: 0.35rem 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
.tag:hover { background: var(--teal-light); border-color: var(--teal); color: var(--teal-dark); }

@media (max-width: 950px) { .content-wrapper { grid-template-columns: 1fr; } }
@media (max-width: 650px) {
  .news-card { grid-template-columns: 1fr; }
  .news-image { height: 160px; }
  .controls { flex-direction: column; }
  .search-box { max-width: 100%; }
}
</style>
</head>
<body>

<div style="max-width:1400px;margin:0 auto;">
  <a href="/" class="page-back">← بازگشت به صفحه اصلی</a>
</div>

<div class="page-header">
  <h1>📰 اخبار و رویدادها</h1>
  <p>آخرین اخبار، سمینارها و رویدادهای بیمارستان امید</p>
</div>

<div class="container">
  <div class="controls">
    <div class="filters">
      <button class="filter-btn active" onclick="filterNews('all', this)">همه</button>
      <button class="filter-btn" onclick="filterNews('news', this)">📰 اخبار</button>
      <button class="filter-btn" onclick="filterNews('event', this)">🎉 رویدادها</button>
      <button class="filter-btn" onclick="filterNews('seminar', this)">🎓 سمینارها</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" placeholder="جستجو در اخبار..." id="searchInput">
      <button class="search-btn" onclick="searchNews()">🔍</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="news-grid" id="newsGrid"></div>
    <div class="sidebar">
      <div class="sidebar-card">
        <h3 class="sidebar-title">📅 تقویم رویدادها</h3>
        <div class="calendar"><div class="calendar-header">تیر ۱۴۰۴</div><div class="calendar-grid" id="calendarGrid"></div></div>
      </div>
      <div class="sidebar-card">
        <h3 class="sidebar-title">🎯 رویدادهای پیش رو</h3>
        <div class="upcoming-events" id="upcomingEvents"></div>
      </div>
      <div class="sidebar-card">
        <h3 class="sidebar-title">🏷️ موضوعات محبوب</h3>
        <div class="popular-tags">
          <span class="tag">واکسیناسیون</span><span class="tag">تغذیه</span><span class="tag">سلامت کودک</span><span class="tag">بارداری</span><span class="tag">قلب</span><span class="tag">دیابت</span><span class="tag">ورزش</span><span class="tag">کرونا</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var newsData = [
  { id:1, type:'news', title:'راه‌اندازی دستگاه MRI ۳ تسلا در بیمارستان', excerpt:'بیمارستان امید با نصب دستگاه MRI ۳ تسلا، جدیدترین تکنولوژی تصویربرداری را در اختیار بیماران قرار می‌دهد.', icon:'🧲', date:'۱۴۰۴/۰۷/۲۳', author:'مدیریت', views:'۲.۵هزار' },
  { id:2, type:'seminar', title:'سمینار آموزشی پیشگیری از دیابت', excerpt:'سمینار رایگان با حضور متخصصین تغذیه و غدد، شنبه ۲۷ تیر ساعت ۱۰ صبح در سالن کنفرانس', icon:'🎓', date:'۱۴۰۴/۰۷/۲۷', author:'واحد آموزش', views:'۱.۸هزار' },
  { id:3, type:'event', title:'جشنواره سالگرد افتتاح بیمارستان', excerpt:'نهمین سالگرد افتتاح بیمارستان امید با برگزاری مراسم ویژه و ارائه خدمات رایگان', icon:'🎉', date:'۱۴۰۴/۰۸/۰۵', author:'روابط عمومی', views:'۳.۲هزار' },
  { id:4, type:'news', title:'کاهش ۴۰ درصدی زمان انتظار در اورژانس', excerpt:'با بازسازی بخش اورژانس و افزایش تیم پزشکی، زمان انتظار بیماران به شدت کاهش یافت', icon:'🚑', date:'۱۴۰۴/۰۷/۲۰', author:'واحد اورژانس', views:'۴.۱هزار' },
  { id:5, type:'seminar', title:'کارگاه CPR برای خانواده‌ها', excerpt:'آموزش عملی احیای قلبی ریوی برای والدین و اعضای خانواده — یکشنبه ۲۸ تیر', icon:'🫀', date:'۱۴۰۴/۰۷/۲۸', author:'دکتر احمدی', views:'۲.۹هزار' },
  { id:6, type:'news', title:'افتتاح کلینیک تخصصی تنفسی', excerpt:'کلینیک ویژه مراقبت از بیماران تنفسی با تیم متخصص عفونی و ریه افتتاح شد', icon:'🫁', date:'۱۴۰۴/۰۷/۱۸', author:'دکتر ذاکر', views:'۵.۵هزار' },
  { id:7, type:'event', title:'همایش سلامت مادر و کودک', excerpt:'برگزاری همایش دو روزه با حضور متخصصین زنان و اطفال کشور', icon:'👶', date:'۱۴۰۴/۰۸/۱۰', author:'کمیته علمی', views:'۱.۶هزار' },
  { id:8, type:'news', title:'عقد تفاهم‌نامه با ۵ بیمه جدید', excerpt:'بیماران بیمه‌های دی، پارسیان، دانا، کوثر و میهن می‌توانند از خدمات بهره‌مند شوند', icon:'💳', date:'۱۴۰۴/۰۷/۱۵', author:'مدیریت', views:'۳.۷هزار' }
];

var upcomingEventsData = [
  { date:'۲۷ تیر', title:'سمینار پیشگیری دیابت' },{ date:'۲۸ تیر', title:'کارگاه CPR' },
  { date:'۵ مرداد', title:'جشنواره سالگرد' },{ date:'۱۰ مرداد', title:'همایش مادر و کودک' },
  { date:'۱۵ مرداد', title:'کنفرانس قلب و عروق' }
];

var typeConfig = { news:{ label:'خبر', class:'badge-news' }, event:{ label:'رویداد', class:'badge-event' }, seminar:{ label:'سمینار', class:'badge-seminar' } };
var currentFilter = 'all', currentSearch = '';

function renderNews() {
  var grid = document.getElementById('newsGrid');
  var filtered = newsData;
  if (currentFilter !== 'all') filtered = filtered.filter(function (n) { return n.type === currentFilter; });
  if (currentSearch) filtered = filtered.filter(function (n) { return n.title.indexOf(currentSearch) !== -1 || n.excerpt.indexOf(currentSearch) !== -1; });
  grid.innerHTML = filtered.map(function (n) {
    return '<div class="news-card"><div class="news-image">' + n.icon + '<span class="news-badge ' + typeConfig[n.type].class + '">' + typeConfig[n.type].label + '</span></div>' +
      '<div class="news-content"><div class="news-meta"><span>📅 ' + n.date + '</span><span>👁️ ' + n.views + '</span></div>' +
      '<h3 class="news-title">' + n.title + '</h3><p class="news-excerpt">' + n.excerpt + '</p>' +
      '<div class="news-footer"><span class="news-author">✍️ ' + n.author + '</span><button class="read-more">ادامه مطلب</button></div></div></div>';
  }).join('');
}

function filterNews(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filters .filter-btn').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderNews();
}

function searchNews() {
  currentSearch = document.getElementById('searchInput').value;
  renderNews();
}

document.getElementById('searchInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') searchNews(); });

function renderCalendar() {
  var grid = document.getElementById('calendarGrid');
  var eventDays = [27, 28, 5, 10, 15]; var html = '';
  for (var i = 1; i <= 30; i++) {
    html += '<div class="calendar-day ' + (eventDays.indexOf(i) !== -1 ? 'has-event' : '') + '">' + i + '</div>';
  }
  grid.innerHTML = html;
}

function renderUpcomingEvents() {
  document.getElementById('upcomingEvents').innerHTML = upcomingEventsData.map(function (e) {
    return '<div class="event-item"><div class="event-date">' + e.date + '</div><div class="event-title">' + e.title + '</div></div>';
  }).join('');
}

renderNews(); renderCalendar(); renderUpcomingEvents();
</script>

<script src="/js/site-shell.js"></script>
</body>
</html>
