<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>راهنمای پوشش کارکنان | بیمارستان امید</title><link rel="stylesheet" href="/css/theme.css"><style>body{padding-top:78px}.article{max-width:1050px;margin:auto;padding:3rem 1.5rem 5rem}.article h1{font-size:clamp(1.8rem,4vw,3rem);margin-bottom:.6rem}.lead{color:var(--text-secondary);line-height:2}.photo{background:#fff;border:1px solid var(--border);border-radius:20px;padding:.8rem;box-shadow:var(--shadow-lg);margin-top:1.5rem}.photo img{width:100%;max-height:720px;object-fit:contain;object-position:center;border-radius:14px;background:var(--primary-light);cursor:zoom-in}.photo figcaption{padding:.7rem .2rem;color:var(--text-muted);font-size:.8rem}.note{margin-top:1rem;padding:1rem;background:var(--teal-light);border-right:4px solid var(--teal);border-radius:10px;color:var(--text-secondary);line-height:2}</style></head><body><main class="article"><div class="section-kicker">راهنمای مراجعین</div><h1>راهنمای پوشش کارکنان</h1><p class="lead">پوشش یکپارچه و قابل تشخیص کارکنان به حفظ نظم، امنیت و سهولت ارتباط مراجعین با کادر بیمارستان کمک می‌کند.</p><figure class="photo"><img src="/assets/guide/employee-dress.png" alt="راهنمای پوشش کارکنان بیمارستان امید" loading="eager"><figcaption>راهنمای پوشش کارکنان بیمارستان امید</figcaption></figure><p class="note">برای شناسایی کارکنان و دریافت راهنمایی، از پرسنل دارای کارت شناسایی کمک بگیرید. در صورت نیاز می‌توانید با اطلاعات لابی تماس بگیرید.</p></main><script src="/js/site-shell.js"></script></body></html>
