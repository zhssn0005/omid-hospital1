<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گالری ویدیو | بیمارستان امید</title>
<meta name="description" content="ویدیوهای آموزشی، تور بخش‌های مختلف، مصاحبه با پزشکان و راهنمای خدمات بیمارستان امید">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
body { padding-top: 5.3rem; }
.page-back { display: inline-block; padding: 1rem 2rem; color: var(--teal); text-decoration: none; font-weight: 700; font-size: 0.9rem; }
.page-header {
  text-align: center; padding: 2.5rem 1rem;
  background: linear-gradient(135deg, var(--primary-light), var(--teal-light));
  border-bottom: 1px solid var(--border);
}
.page-header h1 { font-size: 2.2rem; font-weight: 900; color: var(--text-primary); }
.page-header p { color: var(--text-secondary); margin-top: 0.4rem; }
.container { max-width: 1300px; margin: 2rem auto 4rem; padding: 0 1.5rem; }
.filters { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.filter-btn {
  padding: 0.55rem 1.3rem; border-radius: var(--radius-full); border: 1.5px solid var(--border);
  background: #fff; color: var(--text-secondary); font-weight: 700; font-size: 0.85rem;
  cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
}
.filter-btn:hover { border-color: var(--teal); color: var(--teal); }
.filter-btn.active { background: linear-gradient(135deg, var(--primary), var(--teal)); border-color: transparent; color: #fff; box-shadow: var(--shadow-md); }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
.video-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: var(--transition); cursor: pointer; }
.video-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.video-thumb {
  position: relative; padding-top: 56.25%; overflow: hidden;
  background: linear-gradient(135deg, var(--primary), var(--teal));
  display: flex; align-items: center; justify-content: center;
}
.video-thumb .thumb-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; color: #fff; opacity: 0.85; }
.play-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.9);
  display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--teal);
  transition: var(--transition); z-index: 2;
}
.video-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: #fff; }
.video-duration {
  position: absolute; bottom: 10px; right: 10px; padding: 0.25rem 0.6rem;
  background: rgba(0,0,0,0.7); border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: #fff; z-index: 2;
}
.video-info { padding: 1.3rem; }
.video-category {
  display: inline-block; padding: 0.2rem 0.7rem; background: var(--teal-light); color: var(--teal-dark);
  border-radius: 99px; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.6rem;
}
.video-title { font-size: 1.02rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.4rem; line-height: 1.5; }
.video-desc { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.7; margin-bottom: 0.7rem; }
.video-meta { display: flex; align-items: center; gap: 1rem; font-size: 0.78rem; color: var(--text-muted); }

.modal { display: none; position: fixed; inset: 0; background: rgba(9,53,68,0.7); backdrop-filter: blur(4px); z-index: 9999; padding: 1.5rem; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-content { max-width: 900px; width: 100%; background: #fff; border-radius: var(--radius-lg); overflow: hidden; position: relative; box-shadow: var(--shadow-xl); }
.modal-close {
  position: absolute; top: 0.9rem; left: 0.9rem; width: 40px; height: 40px; border-radius: 50%;
  background: #fff; color: var(--text-primary); border: none; font-size: 1.3rem; cursor: pointer;
  z-index: 10; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md); transition: var(--transition);
}
.modal-close:hover { transform: rotate(90deg); }
.video-player { position: relative; padding-top: 56.25%; background: #000; }
.video-player .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 4rem; background: linear-gradient(135deg, var(--primary), var(--teal)); color: #fff; }
.modal-info { padding: 1.5rem; }
.modal-title { font-size: 1.3rem; font-weight: 900; color: var(--text-primary); margin-bottom: 0.5rem; }
.modal-desc { color: var(--text-secondary); line-height: 1.8; }
@media (max-width: 768px) { .video-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div style="max-width:1400px;margin:0 auto;">
  <a href="/" class="page-back">← بازگشت به صفحه اصلی</a>
</div>

<div class="page-header">
  <h1>📹 گالری ویدیو</h1>
  <p>ویدیوهای آموزشی، تور مجازی و مصاحبه با پزشکان</p>
</div>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" onclick="filterVideos('all', this)">🎬 همه</button>
    <button class="filter-btn" onclick="filterVideos('tour', this)">🏥 تور بیمارستان</button>
    <button class="filter-btn" onclick="filterVideos('education', this)">📚 آموزشی</button>
    <button class="filter-btn" onclick="filterVideos('interview', this)">🎤 مصاحبه</button>
    <button class="filter-btn" onclick="filterVideos('guide', this)">📋 راهنما</button>
  </div>

  <div class="video-grid" id="videoGrid"></div>
</div>

<div class="modal" id="videoModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeVideo()">✕</button>
    <div class="video-player"><div class="ph" id="playerPh">▶️</div></div>
    <div class="modal-info"><h2 class="modal-title" id="modalTitle"></h2><p class="modal-desc" id="modalDesc"></p></div>
  </div>
</div>

<script>
var videos = [
  { id:1, title:'تور کامل بخش NICU', desc:'بازدید از بخش مراقبت‌های ویژه نوزادان با آخرین تجهیزات پزشکی', category:'tour', duration:'۵:۳۰', views:'۱۲.۵هزار', date:'۱۴۰۴/۰۷/۲۰', icon:'👶' },
  { id:2, title:'راهنمای رزرو نوبت آنلاین', desc:'آموزش گام به گام نحوه رزرو نوبت از طریق سایت', category:'guide', duration:'۳:۴۵', views:'۲۵.۳هزار', date:'۱۴۰۴/۰۷/۱۸', icon:'📅' },
  { id:3, title:'مصاحبه با دکتر بهرامی — متخصص اطفال', desc:'گفتگو درباره مراقبت‌های دوران بارداری و نوزادی', category:'interview', duration:'۱۵:۲۰', views:'۸.۲هزار', date:'۱۴۰۴/۰۷/۱۵', icon:'🎤' },
  { id:4, title:'تور اتاق‌های VIP بخش رویال', desc:'معرفی امکانات و خدمات اختصاصی اتاق‌های ویژه', category:'tour', duration:'۴:۱۵', views:'۹.۷هزار', date:'۱۴۰۴/۰۷/۱۲', icon:'👑' },
  { id:5, title:'آموزش مراقبت از بیمار در منزل', desc:'نکات کلیدی برای مراقبت صحیح از بیمار بستری در منزل', category:'education', duration:'۸:۵۰', views:'۱۸.۵هزار', date:'۱۴۰۴/۰۷/۱۰', icon:'🏠' },
  { id:6, title:'راهنمای پذیرش و ترخیص', desc:'فرآیند کامل پذیرش تا ترخیص در بیمارستان امید', category:'guide', duration:'۶:۳۰', views:'۲۲.۱هزار', date:'۱۴۰۴/۰۷/۰۸', icon:'📋' },
  { id:7, title:'معرفی خدمات بخش بین‌الملل IPD', desc:'ارائه خدمات به بیماران خارجی با مترجم و همراه', category:'tour', duration:'۷:۱۰', views:'۵.۸هزار', date:'۱۴۰۴/۰۷/۰۵', icon:'🌍' },
  { id:8, title:'آموزش CPR برای عموم', desc:'آموزش احیای قلبی ریوی برای افراد غیرپزشکی', category:'education', duration:'۱۲:۴۰', views:'۴۲.۳هزار', date:'۱۴۰۴/۰۷/۰۱', icon:'🫀' },
  { id:9, title:'مصاحبه با دکتر شمس — جراح عمومی', desc:'پاسخ به سوالات رایج درباره جراحی و مراقبت پس از آن', category:'interview', duration:'۱۸:۵۵', views:'۱۴.۲هزار', date:'۱۴۰۴/۰۶/۲۸', icon:'🎤' },
  { id:10, title:'تور آزمایشگاه و تصویربرداری', desc:'بازدید از بخش آزمایشگاه، MRI و CT Scan', category:'tour', duration:'۵:۴۵', views:'۱۱.۴هزار', date:'۱۴۰۴/۰۶/۲۵', icon:'🔬' },
  { id:11, title:'آموزش تغذیه سالم برای کودکان', desc:'برنامه غذایی مناسب و نکات تغذیه‌ای کودکان', category:'education', duration:'۱۰:۲۰', views:'۲۸.۷هزار', date:'۱۴۰۴/۰۶/۲۰', icon:'🥗' },
  { id:12, title:'راهنمای استفاده از تله‌مدیسین', desc:'نحوه دریافت مشاوره پزشکی آنلاین و ویدیو کال', category:'guide', duration:'۴:۵۰', views:'۱۹.۶هزار', date:'۱۴۰۴/۰۶/۱۵', icon:'💻' }
];

var categoryNames = { tour:'🏥 تور', education:'📚 آموزشی', interview:'🎤 مصاحبه', guide:'📋 راهنما' };
var currentFilter = 'all';

function renderVideos() {
  var grid = document.getElementById('videoGrid');
  var filtered = currentFilter === 'all' ? videos : videos.filter(function (v) { return v.category === currentFilter; });
  grid.innerHTML = filtered.map(function (v) {
    return '<div class="video-card" onclick="playVideo(' + v.id + ')">' +
      '<div class="video-thumb"><div class="thumb-icon">' + v.icon + '</div>' +
        '<div class="play-btn">▶</div><div class="video-duration">' + v.duration + '</div></div>' +
      '<div class="video-info"><span class="video-category">' + categoryNames[v.category] + '</span>' +
        '<h3 class="video-title">' + v.title + '</h3>' +
        '<p class="video-desc">' + v.desc + '</p>' +
        '<div class="video-meta"><span>👁️ ' + v.views + '</span><span>📅 ' + v.date + '</span></div>' +
      '</div></div>';
  }).join('');
}

function filterVideos(category, btn) {
  currentFilter = category;
  document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderVideos();
}

function playVideo(id) {
  var v = videos.find(function (x) { return x.id === id; });
  if (!v) return;
  document.getElementById('modalTitle').textContent = v.title;
  document.getElementById('modalDesc').textContent = v.desc;
  document.getElementById('playerPh').textContent = v.icon;
  document.getElementById('videoModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeVideo() {
  document.getElementById('videoModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('videoModal').addEventListener('click', function (e) { if (e.target === this) closeVideo(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeVideo(); });

renderVideos();
</script>

<script src="/js/site-shell.js"></script>
</body>
</html>
