<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>پروفایل پزشک | بیمارستان امید</title><meta name="description" content="پروفایل پزشک و اطلاعات نوبت‌دهی بیمارستان امید"><link rel="stylesheet" href="/css/theme.css"><style>body{padding-top:78px}.profile{max-width:1180px;margin:auto;padding:2rem 1.5rem 5rem}.back{display:inline-flex;color:var(--teal);font-weight:800;text-decoration:none;margin-bottom:1.2rem}.profile-hero{display:grid;grid-template-columns:300px 1fr;gap:2rem;align-items:center;padding:2rem;border-radius:24px;background:linear-gradient(135deg,var(--primary-light),var(--teal-light));border:1px solid var(--border)}.avatar{width:300px;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:5rem;cursor:zoom-in;box-shadow:var(--shadow-lg)}.avatar img{width:100%;height:100%;object-fit:contain;background:#fff}.eyebrow{color:var(--teal-dark);font-weight:800}.name{font-size:clamp(1.8rem,4vw,3rem);margin:.4rem 0}.specialty{font-size:1.1rem;color:var(--teal);font-weight:800}.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.tag{padding:.4rem .7rem;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:.8rem;color:var(--text-secondary)}.actions{display:flex;gap:.7rem;flex-wrap:wrap}.content{display:grid;grid-template-columns:1fr 330px;gap:1.3rem;margin-top:1.4rem}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:1.4rem;box-shadow:var(--shadow-sm);margin-bottom:1rem}.card h2{font-size:1.15rem;color:var(--primary);margin-bottom:.7rem}.card p,.card li{color:var(--text-secondary);line-height:2}.card ul{padding-right:1.2rem}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.fact{text-align:center;padding:.8rem;background:var(--primary-light);border-radius:12px}.fact strong{display:block;font-size:1.25rem;color:var(--teal)}.fact span{font-size:.75rem;color:var(--text-muted)}.empty{padding:4rem;text-align:center;color:var(--text-secondary)}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:10000;padding:1.5rem}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:14px}.lightbox button{position:absolute;top:1rem;left:1rem;border:0;border-radius:999px;background:#fff;color:var(--primary);font-size:1.5rem;width:42px;height:42px;cursor:pointer}@media(max-width:800px){.profile-hero,.content{grid-template-columns:1fr}.avatar{width:220px;height:250px;margin:auto}.profile-hero{text-align:center}.tags,.actions{justify-content:center}.facts{grid-template-columns:repeat(3,1fr)}} .avatar img{cursor:zoom-in;transition:transform .3s ease}.avatar img:hover{transform:scale(1.03)}.profile-hero{overflow:hidden}</style></head><body><main class="profile"><a class="back" href="/pages/doctors-list.html">← بازگشت به فهرست پزشکان</a><div id="profileRoot" class="empty">در حال بارگذاری پروفایل پزشک...</div></main><div class="lightbox" id="lightbox" role="dialog" aria-label="نمایش بزرگ تصویر"><button type="button" id="closeLightbox" aria-label="بستن">×</button><img id="lightboxImage" alt=""></div><script src="/js/api.js"></script><script>(function(){var root=document.getElementById('profileRoot');var params=new URLSearchParams(location.search);var id=params.get('id');var requestedName=params.get('name');var numericId=/^\d+$/.test(id||'')?id:null;
if(!numericId && !requestedName){requestedName=id||''}if(!numericId && !requestedName){root.innerHTML='<div class="empty">شناسه پزشک مشخص نشده است.</div>';return}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function fallbackName(d){return d.full_name||(d.bio||'').split(' — ')[0]||'پزشک متخصص'}function imageMarkup(d){return d.image_url?'<img id="doctorImage" src="'+esc(/^\/(assets|uploads)\/[\w./-]+$/.test(String(d.image_url||''))?d.image_url:'/assets/logo.png')+'" alt="'+esc(fallbackName(d))+'">':'<span>👨‍⚕️</span>'}function render(d){var name=fallbackName(d);var spec=d.specialty_name||'پزشک متخصص';var exp=Number(d.experience_years)||0;var rating=Number(d.rating||0).toFixed(1);root.className='';root.innerHTML='<section class="profile-hero"><div class="avatar" id="avatar">'+imageMarkup(d)+'</div><div><div class="eyebrow">تیم پزشکی بیمارستان امید</div><h1 class="name">'+esc(name)+'</h1><div class="specialty">'+esc(spec)+'</div><div class="tags"><span class="tag">⭐ امتیاز '+rating+'</span><span class="tag">🏥 '+exp+' سال تجربه</span><span class="tag">'+(d.is_available?'📅 نوبت‌دهی فعال':'☎️ هماهنگی تلفنی')+'</span></div><div class="actions"><a class="btn btn-primary" href="/booking.html?doctor_id='+encodeURIComponent(d.id)+'">رزرو نوبت</a><a class="btn btn-outline" href="tel:02144480185">تماس با بیمارستان</a></div></div></section><section class="content"><div><article class="card"><h2>درباره پزشک</h2><p>'+esc(d.bio||'اطلاعات تکمیلی این پزشک به‌زودی منتشر می‌شود.')+'</p></article><article class="card"><h2>تحصیلات و سوابق</h2><p>'+esc(d.education||'اطلاعات تحصیلات و سوابق در حال تکمیل است.')+'</p></article><article class="card"><h2>نظرات بیماران</h2><div id="reviews">در حال بارگذاری نظرات...</div></article></div><aside><div class="card"><h2>اطلاعات سریع</h2><div class="facts"><div class="fact"><strong>'+esc(exp)+'</strong><span>سال تجربه</span></div><div class="fact"><strong>'+esc(rating)+'</strong><span>امتیاز</span></div><div class="fact"><strong>'+esc(d.review_count||0)+'</strong><span>نظر</span></div></div></div><div class="card"><h2>محل مراجعه</h2><p>'+esc(d.office_address||'بیمارستان امید، تهران، جنت‌آباد مرکزی')+'</p><p>'+esc(d.office_phone||'۰۲۱-۴۴۴۸۰۱۸۵')+'</p></div></aside></section>';var img=document.getElementById('doctorImage');if(img)img.addEventListener('click',function(){document.getElementById('lightboxImage').src=img.src;document.getElementById('lightboxImage').alt=img.alt;document.getElementById('lightbox').classList.add('open')});var reviews=document.getElementById('reviews');var list=d.reviews||[];reviews.innerHTML=list.length?list.map(function(r){return '<div class="card"><strong>'+esc(r.patient_name||'مراجع')+'</strong><div>⭐'.repeat(Math.max(0,Math.min(5,Number(r.rating)||0)))+'</div><p>'+esc(r.comment||'بدون متن')+'</p></div>'}).join(''):'<p>هنوز نظری ثبت نشده است.</p>'}var request=numericId?OmidAPI.getDoctor(numericId):OmidAPI.getDoctors({search:requestedName,limit:100});request.then(function(res){var doctorData=numericId?res.data:(res.data||[]).find(function(item){return fallbackName(item)===requestedName||String(item.bio||'').indexOf(requestedName)>=0});if(doctorData)render(doctorData);else throw new Error('not found')}).catch(function(){root.innerHTML='<div class="empty">پروفایل پزشک پیدا نشد.</div>'});document.getElementById('closeLightbox').onclick=function(){document.getElementById('lightbox').classList.remove('open')};document.getElementById('lightbox').onclick=function(e){if(e.target===this)this.classList.remove('open')};})();</script><script src="/js/site-shell.js"></script></body></html>
