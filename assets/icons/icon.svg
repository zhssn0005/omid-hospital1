<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#070E1A"/>
  
  <!-- Medical Cross -->
  <g transform="translate(256, 256)">
    <!-- Vertical bar -->
    <rect x="-40" y="-140" width="80" height="280" rx="20" fill="url(#grad1)"/>
    <!-- Horizontal bar -->
    <rect x="-140" y="-40" width="280" height="80" rx="20" fill="url(#grad1)"/>
    
    <!-- Center circle with pulse -->
    <circle cx="0" cy="0" r="55" fill="#070E1A"/>
    <circle cx="0" cy="0" r="45" fill="url(#grad1)"/>
    
    <!-- Heart icon in center -->
    <path d="M 0,-10 
             C -5,-15 -15,-15 -20,-10 
             C -25,-5 -25,5 -20,10 
             L 0,25 
             L 20,10 
             C 25,5 25,-5 20,-10 
             C 15,-15 5,-15 0,-10 Z" 
          fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- Bottom accent -->
  <rect x="0" y="456" width="512" height="56" fill="url(#grad1)" opacity="0.3"/>
</svg>
