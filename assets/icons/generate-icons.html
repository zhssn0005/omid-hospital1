<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تولید آیکون‌های PWA</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #070E1A;
  color: #fff;
  padding: 40px;
  text-align: center;
}
h1 { color: #06B6D4; }
.container {
  max-width: 800px;
  margin: 0 auto;
  background: #0C1A2E;
  padding: 30px;
  border-radius: 20px;
  border: 2px solid #06B6D4;
}
button {
  background: linear-gradient(135deg, #06B6D4, #0284C7);
  color: #fff;
  border: none;
  padding: 15px 40px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  margin: 10px;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(6,182,212,0.4);
}
.preview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 20px;
  margin-top: 30px;
}
.icon-preview {
  background: #122340;
  padding: 20px;
  border-radius: 15px;
  border: 1px solid rgba(6,182,212,0.2);
}
.icon-preview img {
  width: 100%;
  height: auto;
  display: block;
  margin-bottom: 10px;
}
.icon-label {
  font-size: 14px;
  color: #94A3B8;
}
canvas { display: none; }
.success {
  color: #22C55E;
  font-size: 18px;
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
  <h1>🎨 تولید آیکون‌های PWA</h1>
  <p>این ابزار آیکون‌های PWA را در سایزهای مختلف تولید می‌کند</p>
  
  <button onclick="generateAllIcons()">✨ تولید همه آیکون‌ها</button>
  <button onclick="downloadAll()">📥 دانلود همه</button>
  
  <div id="status"></div>
  
  <div class="preview" id="preview"></div>
</div>

<canvas id="canvas"></canvas>

<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const generatedIcons = [];

// SVG source
const svgSource = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#070E1A"/>
  <g transform="translate(256, 256)">
    <rect x="-40" y="-140" width="80" height="280" rx="20" fill="url(#grad1)"/>
    <rect x="-140" y="-40" width="280" height="80" rx="20" fill="url(#grad1)"/>
    <circle cx="0" cy="0" r="55" fill="#070E1A"/>
    <circle cx="0" cy="0" r="45" fill="url(#grad1)"/>
    <path d="M 0,-10 C -5,-15 -15,-15 -20,-10 C -25,-5 -25,5 -20,10 L 0,25 L 20,10 C 25,5 25,-5 20,-10 C 15,-15 5,-15 0,-10 Z" 
          fill="#fff" opacity="0.9"/>
  </g>
  <rect x="0" y="456" width="512" height="56" fill="url(#grad1)" opacity="0.3"/>
</svg>`;

async function generateIcon(size) {
  return new Promise((resolve) => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = size;
    canvas.height = size;
    
    const img = new Image();
    const blob = new Blob([svgSource], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    
    img.onload = () => {
      ctx.drawImage(img, 0, 0, size, size);
      
      canvas.toBlob((blob) => {
        const iconUrl = URL.createObjectURL(blob);
        const fileName = `icon-${size}x${size}.png`;
        
        generatedIcons.push({
          size,
          fileName,
          url: iconUrl,
          blob
        });
        
        // Show preview
        const previewDiv = document.createElement('div');
        previewDiv.className = 'icon-preview';
        previewDiv.innerHTML = `
          <img src="${iconUrl}" alt="${fileName}">
          <div class="icon-label">${size}×${size}</div>
        `;
        document.getElementById('preview').appendChild(previewDiv);
        
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    };
    
    img.src = url;
  });
}

async function generateAllIcons() {
  document.getElementById('status').innerHTML = '<p>⏳ در حال تولید...</p>';
  document.getElementById('preview').innerHTML = '';
  generatedIcons.length = 0;
  
  for (const size of sizes) {
    await generateIcon(size);
  }
  
  document.getElementById('status').innerHTML = '<p class="success">✅ همه آیکون‌ها تولید شدند!</p>';
}

function downloadAll() {
  if (generatedIcons.length === 0) {
    alert('ابتدا آیکون‌ها را تولید کنید!');
    return;
  }
  
  generatedIcons.forEach(icon => {
    const a = document.createElement('a');
    a.href = icon.url;
    a.download = icon.fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
  
  alert('✅ دانلود شروع شد!');
}

// Auto generate on load
window.addEventListener('load', () => {
  setTimeout(generateAllIcons, 500);
});
</script>

</body>
</html>
